<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Cargo ship carrying containers across the sea, representing global agricultural trade">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F7ED"/>
      <stop offset="1" stop-color="#E7F0DA"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F9E50"/>
      <stop offset="1" stop-color="#3A5A40"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="980" cy="118" r="60" fill="#E8B948" opacity="0.85"/>
  <circle cx="980" cy="118" r="82" fill="#E8B948" opacity="0.18"/>
  <!-- dotted trade route + pins -->
  <path d="M120 120 Q400 40 720 130" fill="none" stroke="#A16207" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.7"/>
  <g fill="#A16207">
    <path d="M120 120 a9 9 0 1 1 0.1 0 Z M120 138 l-7 -14 h14 Z"/>
    <path d="M720 130 a9 9 0 1 1 0.1 0 Z M720 148 l-7 -14 h14 Z"/>
  </g>
  <!-- distant coastline / palms -->
  <g opacity="0.5" fill="#588157">
    <path d="M0 250 q120 -40 240 -8 q120 30 240 4 l0 40 h-480Z"/>
    <g transform="translate(96,214)"><rect x="-3" y="0" width="6" height="42" rx="3" fill="#4A7043"/><path d="M0 0 q-30 -14 -46 -6 q26 -2 46 10 q20 -12 46 -10 q-16 -8 -46 6Z" fill="#4A7043"/></g>
  </g>
  <!-- sea -->
  <path d="M0 300 h1200 v160 h-1200Z" fill="url(#sea)"/>
  <g stroke="#F3F7ED" stroke-width="3" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M60 340 q20 -10 40 0 t40 0"/>
    <path d="M880 356 q20 -10 40 0 t40 0"/>
    <path d="M300 386 q22 -10 44 0 t44 0"/>
    <path d="M640 372 q20 -10 40 0 t40 0"/>
  </g>
  <!-- cargo ship -->
  <g transform="translate(430,196)">
    <!-- containers -->
    <g stroke="#2C3E2C" stroke-width="2">
      <rect x="40" y="34" width="66" height="30" rx="3" fill="#4A7043"/>
      <rect x="110" y="34" width="66" height="30" rx="3" fill="#E8B948"/>
      <rect x="180" y="34" width="66" height="30" rx="3" fill="#EDEFE8"/>
      <rect x="55" y="66" width="66" height="30" rx="3" fill="#E8B948"/>
      <rect x="125" y="66" width="66" height="30" rx="3" fill="#4A7043"/>
      <rect x="195" y="66" width="66" height="30" rx="3" fill="#A16207"/>
      <rect x="88" y="98" width="66" height="30" rx="3" fill="#EDEFE8"/>
      <rect x="158" y="98" width="66" height="30" rx="3" fill="#4A7043"/>
    </g>
    <!-- bridge -->
    <rect x="270" y="70" width="46" height="58" rx="4" fill="#EDEFE8" stroke="#2C3E2C" stroke-width="2"/>
    <g fill="#3A5A40"><rect x="278" y="80" width="30" height="7" rx="2"/><rect x="278" y="92" width="30" height="7" rx="2"/></g>
    <!-- hull -->
    <path d="M8 128 h330 l-30 46 h-250 Z" fill="#3A5A40"/>
    <rect x="8" y="128" width="330" height="10" fill="#A16207"/>
  </g>
</svg>
