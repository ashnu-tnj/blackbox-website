  <g fill="#8A6A44" opacity="0.5"><circle cx="176" cy="196" r="3"/><circle cx="200" cy="188" r="2.5"/><circle cx="158" cy="200" r="2.5"/><circle cx="300" cy="204" r="2.5"/><circle cx="322" cy="198" r="2.5"/></g>
