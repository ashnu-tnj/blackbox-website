    <linearGradient id="coprabg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1DE"/>
      <stop offset="1" stop-color="#F3F7ED"/>
    </linearGradient>
    <radialGradient id="cup" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#E8D3AE"/>
      <stop offset="1" stop-color="#CBB184"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#coprabg)"/>
  <circle cx="240" cy="170" r="120" fill="#DCE9C6" opacity="0.7"/>
  <ellipse cx="240" cy="288" rx="128" ry="22" fill="#3A5A40" opacity="0.12"/>
  <!-- back half -->
