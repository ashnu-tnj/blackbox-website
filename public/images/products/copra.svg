<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Engraving of dried copra">
  <defs>
    <pattern id="hp" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#33452F" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="480" height="360" fill="#F1ECDB"/>
  <rect x="14" y="14" width="452" height="332" fill="none" stroke="#CFC7AC" stroke-width="1.5"/>
  <rect x="20" y="20" width="440" height="320" fill="none" stroke="#CFC7AC" stroke-width="1"/>
  <!-- back half -->
  <g transform="translate(306,196) rotate(10)" stroke="#33452F" stroke-width="2.3" stroke-linejoin="round">
    <path d="M-58 -4 A58 52 0 0 0 58 -4 A58 26 0 0 1 -58 -4 Z" fill="#EFE9D4"/>
    <ellipse cx="0" cy="-4" rx="58" ry="26" fill="#F6F2E4"/>
    <ellipse cx="0" cy="-4" rx="42" ry="17" fill="none" opacity="0.7"/>
  </g>
  <!-- front half -->
  <g transform="translate(182,198) rotate(-9)" stroke="#33452F" stroke-width="2.4" stroke-linejoin="round">
    <path d="M-74 -6 A74 66 0 0 0 74 -6 A74 34 0 0 1 -74 -6 Z" fill="#EFE9D4"/>
    <path d="M0 60 A74 66 0 0 0 74 -6 L58 -6 A58 52 0 0 1 0 46 Z" fill="url(#hp)"/>
    <ellipse cx="0" cy="-6" rx="74" ry="34" fill="#F6F2E4"/>
    <ellipse cx="0" cy="-6" rx="55" ry="23" fill="none" opacity="0.7"/>
  </g>
  <!-- dried flecks -->
  <g fill="#33452F" opacity="0.6"><circle cx="170" cy="196" r="2.6"/><circle cx="196" cy="188" r="2.2"/><circle cx="152" cy="200" r="2.2"/><circle cx="300" cy="200" r="2.2"/><circle cx="322" cy="194" r="2.2"/></g>
</svg>
