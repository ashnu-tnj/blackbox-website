    <g transform="translate(118,120)"><path d="M0 -16V16M-14 -8L14 8M-14 8L14 -8"/></g>
    <g transform="translate(360,132)"><path d="M0 -14V14M-12 -7L12 7M-12 7L12 -7"/></g>
    <g transform="translate(348,238)"><path d="M0 -12V12M-10 -6L10 6M-10 6L10 -6"/></g>
    <g transform="translate(128,236)"><path d="M0 -11V11M-9 -5L9 5M-9 5L9 -5"/></g>
  </g>
</svg>
